name: Build StopWatch APK

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 1.0.1)'
        required: false
        type: string

# Allow only one concurrent build
concurrency:
  group: stopwatch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: '25.2.9519653'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "KEYSTORE_BASE64 not set - using debug signing"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f keystore.jks ]; then
            echo "Using production keystore for signing"
          else
            echo "No keystore found - using debug signing"
            unset KEYSTORE_PATH
          fi
          
          # Build the release APK
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 || true
          if [ ! -f app/build/outputs/apk/release/*.apk ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
          fi

      - name: Rename APK with Version
        run: |
          VERSION="1.0.0"
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          
          apk_path=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$apk_path" ]; then
            cp "$apk_path" "StopWatch-v${VERSION}.apk"
            echo "APK renamed: StopWatch-v${VERSION}.apk"
            echo "APK_PATH=StopWatch-v${VERSION}.apk" >> $GITHUB_ENV
            echo "VERSION_NAME=v${VERSION}" >> $GITHUB_ENV
          fi

      - name: Upload APK to apk folder
        run: |
          mkdir -p apk
          if [ -f "${{ env.APK_PATH }}" ]; then
            cp "${{ env.APK_PATH }}" apk/
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopWatch-APK-${{ env.VERSION_NAME || 'latest' }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StopWatch ${{ env.VERSION_NAME }}
          body: |
            ## StopWatch ${{ env.VERSION_NAME }}
            
            ### Features:
            - Stopwatch with lap timer and pause/reset
            - Countdown timer (hours, minutes, seconds)
            - Alarm clock with scheduled alarms
            - Custom alarm sound selection and MP3 upload
            - Adjustable alarm volume
            - Vibrate on/off toggle
            - Background alarm support
            - Dark theme interface
            - All settings persist across app restarts
            
            ### Download:
            Download the APK from the assets below.
            
            ### Developer:
            [jnetai.com](https://jnetai.com)
          files: |
            ${{ env.APK_PATH }}
          draft: false
          prerelease: false
