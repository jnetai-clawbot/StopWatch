name: Build StopWatch APK

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 1.0.1)'
        required: false
        type: string

permissions:
  contents: write
  actions: read
  checks: read

# Allow only one concurrent build
concurrency:
  group: stopwatch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Bundle alarm sounds into APK resources
        run: |
          mkdir -p app/src/main/res/raw
          # Copy all alarmN.mp3 from sounds/ into res/raw/ with proper resource names
          # Resources named alarm_1, alarm_2 etc get referenced via R.raw.alarm_1
          i=1
          for f in sounds/alarm*.mp3; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              ext="${fname##*.}"
              name="${fname%.*}"
              echo "Bundling sound: $fname ($(stat -c%s "$f") bytes) -> app/src/main/res/raw/alarm_${i}.mp3"
              cp "$f" "app/src/main/res/raw/alarm_${i}.${ext}"
              i=$((i + 1))
            fi
          done
          echo "Total sound files bundled: $((i - 1))"
          ls -la app/src/main/res/raw/
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "KEYSTORE_BASE64 not set - using debug signing"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f keystore.jks ]; then
            echo "Using production keystore for signing"
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "No keystore found - building debug APK"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK with Version
        run: |
          VERSION="1.0.0"
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          
          # Try release first, fall back to debug
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "StopWatch-v${VERSION}.apk"
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "StopWatch-v${VERSION}.apk"
          fi
          
          if [ -f "StopWatch-v${VERSION}.apk" ]; then
            echo "APK renamed: StopWatch-v${VERSION}.apk ($(stat -c%s StopWatch-v${VERSION}.apk) bytes)"
            echo "APK_PATH=StopWatch-v${VERSION}.apk" >> $GITHUB_ENV
            echo "VERSION_NAME=v${VERSION}" >> $GITHUB_ENV
          else
            echo "ERROR: No APK found to rename!"
            exit 1
          fi

      - name: Upload APK to apk folder
        run: |
          mkdir -p apk
          if [ -f "${{ env.APK_PATH }}" ]; then
            cp "${{ env.APK_PATH }}" apk/
            ls -la apk/
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopWatch-APK-${{ env.VERSION_NAME || 'latest' }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StopWatch ${{ env.VERSION_NAME }}
          body: |
            ## StopWatch ${{ env.VERSION_NAME }}
            
            ### Features:
            - ⏱️ **Stopwatch** with lap timer and pause/reset
            - ⏳ **Countdown Timer** (hours, minutes, seconds)
            - ⏰ **Alarm Clock** with scheduled alarms
            - 🎵 **Custom alarm sound selection** and MP3 upload
            - 🔊 **Adjustable alarm volume**
            - 📳 **Vibrate on/off toggle**
            - 🔙 **Background alarm support**
            - 🎨 **Dark theme interface**
            - 💾 **All settings persist across app restarts**
            
            ### Download:
            Download the APK from the assets below.
            
            ### Developer:
            [jnetai.com](https://jnetai.com)
          files: |
            ${{ env.APK_PATH }}
          draft: false
          prerelease: false
